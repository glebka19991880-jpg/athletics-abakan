<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Онлайн-результаты соревнований по легкой атлетике города Абакана.">
    <title>Результаты соревнований | Легкая атлетика Абакан</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #1a365d; margin-bottom: 30px; }
        .filter-box { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .filter-group { display: flex; flex-direction: column; align-items: flex-start; }
        .filter-group label { font-size: 14px; color: #4a5568; margin-bottom: 5px; font-weight: bold; }
        .filter-box select { padding: 8px 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; min-width: 150px; }
        .filter-box button { padding: 8px 15px; background: #3182ce; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; height: 42px; margin-top: auto; }
        .filter-box a { text-decoration: none; color: #e53e3e; font-size: 14px; line-height: 42px; margin-top: auto; }
        .event-block { background: white; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow: hidden; }
        .event-header { background: #2b6cb0; color: white; padding: 15px 20px; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .event-header:hover { background: #2c5282; }
        .event-content { display: none; padding: 15px; overflow-x: auto; }
        .event-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        th { background: #edf2f7; color: #4a5568; font-weight: bold; }
        tr:hover { background: #f7fafc; }
        .place-1 { color: #d69e2e; font-weight: bold; font-size: 16px; }
        .place-2 { color: #a0aec0; font-weight: bold; font-size: 16px; }
        .place-3 { color: #b7791f; font-weight: bold; font-size: 16px; }
        .result-best { font-weight: bold; color: #2f855a; font-size: 16px; }
        @media (max-width: 768px) {
            .event-header { font-size: 16px; }
            th, td { padding: 6px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Результаты соревнований</h1>

        <!-- Фильтры -->
        <div class="filter-box">
            <form method="get" style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; justify-content: center;">
                <div class="filter-group">
                    <label for="gender">Пол:</label>
                    <select name="gender" id="gender">
                        <option value="">Все</option>
                        {% for g in genders %}
                            <option value="{{ g }}" {% if selected_gender == g %}selected{% endif %}>{{ g }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="filter-group">
                    <label for="category">Возрастная категория:</label>
                    <select name="category" id="category">
                        <option value="">Все</option>
                        {% for c in categories %}
                            <option value="{{ c }}" {% if selected_category == c %}selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit">Применить</button>
                <a href="{% url 'spectator_results' %}">Сбросить</a>
            </form>
        </div>

        <!-- Сюда будут подгружаться результаты (AJAX) -->
        <div id="results-container">
            {% include 'results_partial.html' %}
        </div>
    </div>

    <!-- Скрипт аккордеона -->
    <script>
        function toggleEvent(element) {
            const content = element.nextElementSibling;
            content.classList.toggle('active');
            const arrow = element.querySelector('span:last-child');
            if (content.classList.contains('active')) {
                arrow.textContent = '▲';
            } else {
                arrow.textContent = '▼';
            }
        }
    </script>

    <!-- Скрипт автообновления (AJAX) -->
    <script>
        function updateResults() {
            const urlParams = new URLSearchParams(window.location.search).toString();
            fetch(`/results/ajax/?${urlParams}`)
                .then(response => response.text())
                .then(html => {
                    const container = document.getElementById('results-container');
                    // Запоминаем, какие вкладки были открыты
                    const openIndexes = Array.from(document.querySelectorAll('.event-content.active'))
                        .map(el => Array.from(document.querySelectorAll('.event-content')).indexOf(el));
                    
                    container.innerHTML = html; // Обновляем данные
                    
                    // Возвращаем открытые вкладки обратно
                    const newContents = document.querySelectorAll('.event-content');
                    openIndexes.forEach(index => {
                        if (newContents[index]) newContents[index].classList.add('active');
                    });
                })
                .catch(error => console.error('Ошибка обновления:', error));
        }

        // Запускаем обновление каждые 3 секунды (3000 мс)
        setInterval(updateResults, 3000);
    </script>
</body>
</html>
